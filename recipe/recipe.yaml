schema_version: 1

context:
  name: renumerate
  version: "2.4.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 6d2c16c893276bfec6c1f84d4c81e8353fb1cbd7c2bd1d4941c9f772cb5e0dd9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=81.0.0
    - packaging >=26.3.0
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.16.0
    - pkg-about >=2.4.5

tests:
  - python:
      imports:
        - renumerate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Reverse enumerate.
  license: Zlib
  license_file: LICENSE
  homepage: https://github.com/karpierz/renumerate
  documentation: https://renumerate.readthedocs.io/

extra:
  recipe-maintainers:
    - thewchan
